apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: practica-s08
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend-s08:1.0
          imagePullPolicy: Never # Usa la imagen construida en Minikube
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: practica-s08
spec:
  type: NodePort # Expone la API hacia el exterior
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080